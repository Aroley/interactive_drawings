<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Projection</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: rgb(255, 255, 255);
      }

      canvas {
        display: block;
        background: white;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157/build/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();
      socket.on("connect", () => socket.emit("register", "projector"));

      const scene = new THREE.Scene();

      const camera = new THREE.OrthographicCamera(
        window.innerWidth / -2,
        window.innerWidth / 2,
        window.innerHeight / 2,
        window.innerHeight / -2,
        1,
        1000,
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x9489d8, 1);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);

      // last timestamp used for a simple dt/frame-scale in the animation loop
      let __lastNow = performance.now();

      window.addEventListener("resize", () => {
        camera.left = window.innerWidth / -2;
        camera.right = window.innerWidth / 2;
        camera.top = window.innerHeight / 2;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const drawingMap = new Map();
      const drawings = [];
      const MAX_DRAWINGS = 20; // limit to 20 drawings on screen
      const TRAIL_LENGTH = 3;

      // ── Trail helpers ─────────────────────────────────────────────────
      function createTrailMesh(material, geometry) {
        const mat = material.clone();
        mat.opacity = 0;
        const mesh = new THREE.Mesh(geometry, mat);
        scene.add(mesh);
        return mesh;
      }

      function disposeMesh(mesh) {
        mesh.userData.trail.forEach((t) => {
          scene.remove(t.mesh);
          t.mesh.geometry.dispose();
          t.mesh.material.dispose();
        });
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.map && mesh.material.map.dispose();
        mesh.material.dispose();
      }

      // ── Add drawing ───────────────────────────────────────────────────
      socket.on("newDrawing", ({ id, imageData, throwSpeed }) => {
        const loader = new THREE.TextureLoader();
        loader.load(imageData, (texture) => {
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          const baseSize = 180; // Reduced from 360 to 240 (33% smaller)
          const aspect = texture.image.width / texture.image.height;
          const w = baseSize * aspect;
          const h = baseSize;

          const geometry = new THREE.PlaneGeometry(w, h);

          // KEY FIX: Full opacity (1.0) for vibrant colors
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: 1.0, // Was 0.92, now full vibrant
          });

          const mesh = new THREE.Mesh(geometry, material);
          // spawn X more spread out so drawings don't line up in a narrow column
          const spawnX = (Math.random() - 0.5) * window.innerWidth * 0.9;
          // spawn slightly above the top so the launch brings it into view
          const spawnY = -window.innerHeight / 2 - Math.max(80, h * 0.5);
          mesh.position.set(spawnX, spawnY, 0);

          // Stronger launch: amplify throwSpeed to make drawings land harder
          // Compute a strong downward launch so the drawing visibly enters the screen
          const baseThrow = throwSpeed || 0.6;
          const vy = Math.min(
            Math.max(baseThrow * 9 + Math.random() * 2, 6),
            18,
          );

          const trail = [];
          for (let i = 0; i < TRAIL_LENGTH; i++) {
            trail.push({ mesh: createTrailMesh(material, geometry) });
          }

          mesh.userData = {
            drawingId: id,
            // Smaller initial random horizontal velocity but with a bit more spread
            vx: (Math.random() - 0.5) * 3,
            vy,
            wobble: Math.random() * Math.PI * 2,
            launched: true,
            w,
            h,
            // Removed personality - all bounce now
            morphSpeed: 0.4 + Math.random() * 0.8,
            morphAmp: 0.04 + Math.random() * 0.06,
            morphPhase: Math.random() * Math.PI * 2,
            // much smaller initial rotation so items don't spin wildly
            rotationSpeed: (Math.random() - 0.5) * 0.012,
            trail,
            trailIndex: 0,
            trailTimer: 0,
            flagged: false,
            flagTimer: 0,
            removing: false,
            removeProgress: 0,
            // Per-drawing agency: occasional impulses and subtle drift to fake life
            agencyTimer: 0,
            // base interval in frames for impulses (will be randomized at runtime)
            agencyInterval: 80 + Math.floor(Math.random() * 140),
            // strength of occasional impulse (reduced for slower movement)
            agencyStrength: 0.35 + Math.random() * 0.7,
            // small variation in how strongly the center pull affects this drawing
            centerPullFactor: 0.6 + Math.random() * 1.2,
            // smoothing targets for rendered position (avoid micro-jitter)
            _targetX: mesh.position.x,
            _targetY: mesh.position.y,
          };

          scene.add(mesh);
          drawings.push(mesh);
          drawingMap.set(id, mesh);

          // If we're over the limit, gently mark the oldest drawing for removal
          // rather than immediately disposing it so it fades out slowly.
          if (drawings.length > MAX_DRAWINGS) {
            // Find the oldest that isn't already removing
            for (let i = 0; i < drawings.length; i++) {
              const cand = drawings[i];
              if (!cand.userData.removing) {
                cand.userData.removing = true;
                cand.userData.removeProgress = 0;
                // Start a longer fade so it's gradual
                cand.userData.autoFadeStart = performance.now();
                cand.userData.autoFadeDuration = 1800 + Math.random() * 800;
                break;
              }
            }
          }
        });
      });

      // ── Flag drawing ──────────────────────────────────────────────────
      socket.on("flagDrawing", ({ drawingId }) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.flagged = true;
        mesh.userData.flagTimer = 0;
        mesh.material.color = new THREE.Color(1, 0.3, 0.3);
        mesh.userData.autoFadeStart = performance.now();
        mesh.userData.autoFadeDuration = 1000; // 1 second fade to match server
      });

      socket.on("pardonDrawing", ({ drawingId }) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.flagged = false;
        mesh.userData.autoFadeStart = null;
        mesh.material.color = new THREE.Color(1, 1, 1);
        mesh.material.opacity = 1.0;
      });

      socket.on("removeDrawing", (drawingId) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.removing = true;
      });

      // ── Collision helpers ─────────────────────────────────────────────
      const COLLISION_PADDING = 12;

      // Collision damping factor applied to velocities on bounce (0..1)
      const COLLISION_DAMPING = 0.72;

      function overlaps(a, b) {
        const aw = (a.userData.w / 2 + COLLISION_PADDING) * a.scale.x;
        const ah = (a.userData.h / 2 + COLLISION_PADDING) * a.scale.y;
        const bw = (b.userData.w / 2 + COLLISION_PADDING) * b.scale.x;
        const bh = (b.userData.h / 2 + COLLISION_PADDING) * b.scale.y;
        const ax = a.userData._targetX;
        const ay = a.userData._targetY;
        const bx = b.userData._targetX;
        const by = b.userData._targetY;
        return Math.abs(ax - bx) < aw + bw && Math.abs(ay - by) < ah + bh;
      }

      function bounceVelocities(a, b) {
        const dx = b.position.x - a.position.x || 0.1;
        const dy = b.position.y - a.position.y || 0.1;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const nx = dx / dist,
          ny = dy / dist;
        const dvn =
          (a.userData.vx - b.userData.vx) * nx +
          (a.userData.vy - b.userData.vy) * ny;
        if (dvn < 0) return;

        // Add more randomness to bounces for chaos, but damp impulse so momentum is reduced
        const randomFactor = 0.8 + Math.random() * 0.6; // 0.8 to 1.4
        const impulseX = dvn * nx * randomFactor * COLLISION_DAMPING;
        const impulseY = dvn * ny * randomFactor * COLLISION_DAMPING;
        a.userData.vx -= impulseX;
        a.userData.vy -= impulseY;
        b.userData.vx += impulseX;
        b.userData.vy += impulseY;
        // small rotational jolt on collision (reduced magnitude)
        a.userData.rotationSpeed += (Math.random() - 0.5) * 0.01;
        b.userData.rotationSpeed += (Math.random() - 0.5) * 0.01;
      }

      // Physics tuning
      const FRICTION = 0.999; // higher friction so items slow down faster
      const CENTER_PULL = 0.02; // small force pulling drawings toward screen center
      const MAX_VEL = 1; // clamp velocities lower so items move slower
      const COLLISION_PUSH = 0.8; // gentler positional push after collision

      // ── Animation loop ────────────────────────────────────────────────
      function animate() {
        requestAnimationFrame(animate);
        renderer.clear();

        const t = performance.now() * 0.001;
        const now = performance.now();
        // time-step and frame-scale for smoothing across variable frame-rates
        const dt = Math.min(0.05, (now - __lastNow) / 1000);
        __lastNow = now;
        const fs = Math.max(0.5, Math.min(2, dt * 60));

        const toRemove = [];

        drawings.forEach((d) => {
          const ud = d.userData;

          // ── Removal fade-out ────────────────────────────────────────
          if (ud.removing) {
            ud.removeProgress = (ud.removeProgress || 0) + 0.2;
            d.material.opacity = Math.max(0, 1.0 - ud.removeProgress * 2);
            d.scale.multiplyScalar(0.96);
            if (ud.removeProgress > 0.4) toRemove.push(d);
            return;
          }

          // ── Auto-fade when flagged ──────────────────────────────────
          if (ud.flagged && ud.autoFadeStart) {
            const elapsed = now - ud.autoFadeStart;
            const frac = Math.min(elapsed / ud.autoFadeDuration, 1);
            d.material.opacity = 1.0 * (1 - frac * 0.7);
          }

          // ── Shake when freshly flagged ──────────────────────────────
          if (ud.flagged) {
            ud.flagTimer++;
            if (ud.flagTimer < 30) {
              d.position.x += Math.sin(ud.flagTimer * 1.8) * 3;
            }
          }

          // ── Movement ───────────────────────────────────────────────
          if (ud.launched) {
            // stronger gravity initially for a snappier landing (scaled)
            ud.vy -= 0.18 * fs;
            ud._targetX += ud.vx * fs;
            ud._targetY += ud.vy * fs;
            if (Math.abs(ud.vy) < 1.5) {
              ud.launched = false;
              // More chaotic post-launch velocity
              ud.vy = (Math.random() - 0.5) * 1.2;
              ud.vx = (Math.random() - 0.5) * 1.2;
            }
          } else {
            ud._targetX += ud.vx * fs;
            ud._targetY += ud.vy * fs;
            // More pronounced wobble
            ud._targetY += Math.sin(t + ud.wobble) * 0.3 * fs;
          }

          // Apply friction to velocities (exponential scale for stability)
          ud.vx *= Math.pow(FRICTION, fs);
          ud.vy *= Math.pow(FRICTION, fs);

          // Per-drawing gentle lateral drift to break grid patterns
          const driftX = Math.sin(t * 0.8 + ud.wobble) * 0.08;
          const driftY = Math.cos(t * 0.6 + ud.morphPhase) * 0.04;
          ud.vx += driftX * (ud.launched ? 0.3 : 1) * fs;
          ud.vy += driftY * (ud.launched ? 0.3 : 1) * fs;

          // center pull force proportional to distance from center, modulated per-drawing
          const pullFactor = ud.centerPullFactor || 1;
          const pullX =
            -ud._targetX *
            CENTER_PULL *
            0.001 *
            (ud.launched ? 0.6 : 1) *
            pullFactor;
          const pullY =
            -ud._targetY *
            CENTER_PULL *
            0.001 *
            (ud.launched ? 0.6 : 1) *
            pullFactor;
          ud.vx += pullX * fs;
          ud.vy += pullY * fs;

          // Agency impulses: occasional small random pushes so items appear to make decisions
          ud.agencyTimer = (ud.agencyTimer || 0) + 1;
          if (ud.agencyTimer > (ud.agencyInterval || 100)) {
            ud.agencyTimer = 0;
            // Random directional impulse biased toward center to avoid escape
            const ang = Math.random() * Math.PI * 2;
            const ix = Math.cos(ang) * ud.agencyStrength;
            const iy = Math.sin(ang) * ud.agencyStrength;
            // Slightly bias impulse toward center
            ud.vx += (ix - ud._targetX * 0.0006) * fs;
            ud.vy += (iy - ud._targetY * 0.0006) * fs;
            // Add a very small rotation impulse as part of the agency movement
            ud.rotationSpeed +=
              (Math.random() - 0.5) * 0.006 * ud.agencyStrength * fs;
          }

          // Clamp velocities
          ud.vx = Math.max(-MAX_VEL, Math.min(MAX_VEL, ud.vx));
          ud.vy = Math.max(-MAX_VEL, Math.min(MAX_VEL, ud.vy));

          // ── Morph / breathe ─────────────────────────────────────────
          const b1 =
            1 + Math.sin(t * ud.morphSpeed + ud.morphPhase) * ud.morphAmp;
          const b2 =
            1 +
            Math.cos(t * ud.morphSpeed * 1.37 + ud.morphPhase + 1) *
              (ud.morphAmp * 0.4);
          d.scale.set(b1 * b2, b1, 1);
          // Apply per-frame damping to rotation and clamp to a safe range
          ud.rotationSpeed *= 0.92;
          ud.rotationSpeed = Math.max(-0.06, Math.min(0.06, ud.rotationSpeed));
          d.rotation.z += ud.rotationSpeed;

          // ── Trail ───────────────────────────────────────────────────
          ud.trailTimer++;
          if (ud.trailTimer % 3 === 0) {
            const ghost = ud.trail[ud.trailIndex % TRAIL_LENGTH];
            ghost.mesh.position.set(ud._targetX, ud._targetY, -1);
            ghost.mesh.rotation.z = d.rotation.z;
            ghost.mesh.scale.set(d.scale.x, d.scale.y, 1);
            ghost.mesh.material.opacity = 0.18;
            ud.trailIndex++;
          }
          ud.trail.forEach((g) => {
            g.mesh.material.opacity *= 0.82;
          });

          // ── Keep drawings near visible screen: soft bounce-back when approaching edges
          const marginX = window.innerWidth / 2 + 120; // allow small offscreen
          const marginY = window.innerHeight / 2 + 120;
          if (Math.abs(ud._targetX) > marginX) {
            const dir = Math.sign(ud._targetX);
            // gently push back toward center and damp horizontal motion
            ud._targetX -=
              dir * Math.min(Math.abs(ud._targetX) - marginX, 8) * fs;
            d.userData.vx += -dir * 0.8 * fs;
            d.userData.vx *= 0.85;
          }
          if (Math.abs(ud._targetY) > marginY) {
            const dir = Math.sign(ud._targetY);
            ud._targetY -=
              dir * Math.min(Math.abs(ud._targetY) - marginY, 8) * fs;
            d.userData.vy += -dir * 0.8 * fs;
            d.userData.vy *= 0.85;
          }
        });

        // ── Collision pass - ALL drawings bounce ─────────────────────────
        for (let i = 0; i < drawings.length; i++) {
          const a = drawings[i];
          if (a.userData.launched || a.userData.removing) continue;

          for (let j = i + 1; j < drawings.length; j++) {
            const b = drawings[j];
            if (b.userData.launched || b.userData.removing) continue;
            if (!overlaps(a, b)) continue;

            // All drawings bounce - removed personality system
            bounceVelocities(a, b);

            const dx = b.userData._targetX - a.userData._targetX || 0.1;
            const dy = b.userData._targetY - a.userData._targetY || 0.1;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const push = COLLISION_PUSH * fs * 0.5;
            a.userData._targetX -= (dx / dist) * push;
            a.userData._targetY -= (dy / dist) * push;
            b.userData._targetX += (dx / dist) * push;
            b.userData._targetY += (dy / dist) * push;
          }
        }

        // ── Remove flagged-out meshes ─────────────────────────────────────
        toRemove.forEach((d) => {
          const idx = drawings.indexOf(d);
          if (idx !== -1) drawings.splice(idx, 1);
          drawingMap.delete(d.userData.drawingId);
          disposeMesh(d);
        });

        // Smoothly interpolate rendered positions toward physics targets
        drawings.forEach((d) => {
          const ud = d.userData;
          // smoothing alpha scaled by frame-scale (fs) and clamped to reasonable range
          const smoothAlpha = Math.max(0.04, Math.min(0.32, 0.18 * fs));
          d.position.x += (ud._targetX - d.position.x) * smoothAlpha;
          d.position.y += (ud._targetY - d.position.y) * smoothAlpha;
        });

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
