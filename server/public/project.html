<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Projection</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: rgb(255, 255, 255);
      }

      canvas {
        display: block;
        background: white;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157/build/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();
      socket.on("connect", () => socket.emit("register", "projector"));

      const scene = new THREE.Scene();

      const camera = new THREE.OrthographicCamera(
        window.innerWidth / -2,
        window.innerWidth / 2,
        window.innerHeight / 2,
        window.innerHeight / -2,
        1,
        1000,
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x9489d8, 1);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.left = window.innerWidth / -2;
        camera.right = window.innerWidth / 2;
        camera.top = window.innerHeight / 2;
        camera.bottom = window.innerHeight / -2;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const drawingMap = new Map();
      const drawings = [];
      const MAX_DRAWINGS = 30; // Increased from 30 to allow more smaller drawings
      const TRAIL_LENGTH = 3;

      // ── Trail helpers ─────────────────────────────────────────────────
      function createTrailMesh(material, geometry) {
        const mat = material.clone();
        mat.opacity = 0;
        const mesh = new THREE.Mesh(geometry, mat);
        scene.add(mesh);
        return mesh;
      }

      function disposeMesh(mesh) {
        mesh.userData.trail.forEach((t) => {
          scene.remove(t.mesh);
          t.mesh.geometry.dispose();
          t.mesh.material.dispose();
        });
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.map && mesh.material.map.dispose();
        mesh.material.dispose();
      }

      // ── Add drawing ───────────────────────────────────────────────────
      socket.on("newDrawing", ({ id, imageData, throwSpeed }) => {
        const loader = new THREE.TextureLoader();
        loader.load(imageData, (texture) => {
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          const baseSize = 180; // Reduced from 360 to 240 (33% smaller)
          const aspect = texture.image.width / texture.image.height;
          const w = baseSize * aspect;
          const h = baseSize;

          const geometry = new THREE.PlaneGeometry(w, h);

          // KEY FIX: Full opacity (1.0) for vibrant colors
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: 1.0, // Was 0.92, now full vibrant
          });

          const mesh = new THREE.Mesh(geometry, material);
          // spawn X more spread out so drawings don't line up in a narrow column
          const spawnX = (Math.random() - 0.5) * window.innerWidth * 0.9;
          mesh.position.set(spawnX, -window.innerHeight / 2 - 200, 0);

          // Stronger launch: amplify throwSpeed to make drawings land harder
          const vy = Math.min(Math.max((throwSpeed || 0.6) * 12, 6), 20);

          const trail = [];
          for (let i = 0; i < TRAIL_LENGTH; i++) {
            trail.push({ mesh: createTrailMesh(material, geometry) });
          }

          mesh.userData = {
            drawingId: id,
            // Smaller initial random horizontal velocity but with a bit more spread
            vx: (Math.random() - 0.5) * 3,
            vy,
            wobble: Math.random() * Math.PI * 2,
            launched: true,
            w,
            h,
            // Removed personality - all bounce now
            morphSpeed: 0.4 + Math.random() * 0.8,
            morphAmp: 0.04 + Math.random() * 0.06,
            morphPhase: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.006,
            trail,
            trailIndex: 0,
            trailTimer: 0,
            flagged: false,
            flagTimer: 0,
            removing: false,
            removeProgress: 0,
            // Per-drawing agency: occasional impulses and subtle drift to fake life
            agencyTimer: 0,
            // base interval in frames for impulses (will be randomized at runtime)
            agencyInterval: 80 + Math.floor(Math.random() * 140),
            // strength of occasional impulse
            agencyStrength: 0.6 + Math.random() * 1.2,
            // small variation in how strongly the center pull affects this drawing
            centerPullFactor: 0.6 + Math.random() * 1.2,
          };

          scene.add(mesh);
          drawings.push(mesh);
          drawingMap.set(id, mesh);

          if (drawings.length > MAX_DRAWINGS) {
            const old = drawings.shift();
            drawingMap.delete(old.userData.drawingId);
            disposeMesh(old);
          }
        });
      });

      // ── Flag drawing ──────────────────────────────────────────────────
      socket.on("flagDrawing", ({ drawingId }) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.flagged = true;
        mesh.userData.flagTimer = 0;
        mesh.material.color = new THREE.Color(1, 0.3, 0.3);
        mesh.userData.autoFadeStart = performance.now();
        mesh.userData.autoFadeDuration = 1000; // 1 second fade to match server
      });

      socket.on("pardonDrawing", ({ drawingId }) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.flagged = false;
        mesh.userData.autoFadeStart = null;
        mesh.material.color = new THREE.Color(1, 1, 1);
        mesh.material.opacity = 1.0;
      });

      socket.on("removeDrawing", (drawingId) => {
        const mesh = drawingMap.get(drawingId);
        if (!mesh) return;
        mesh.userData.removing = true;
      });

      // ── Collision helpers ─────────────────────────────────────────────
      const COLLISION_PADDING = 12;

      // Collision damping factor applied to velocities on bounce (0..1)
      const COLLISION_DAMPING = 0.7;

      function overlaps(a, b) {
        const aw = (a.userData.w / 2 + COLLISION_PADDING) * a.scale.x;
        const ah = (a.userData.h / 2 + COLLISION_PADDING) * a.scale.y;
        const bw = (b.userData.w / 2 + COLLISION_PADDING) * b.scale.x;
        const bh = (b.userData.h / 2 + COLLISION_PADDING) * b.scale.y;
        return (
          Math.abs(a.position.x - b.position.x) < aw + bw &&
          Math.abs(a.position.y - b.position.y) < ah + bh
        );
      }

      function bounceVelocities(a, b) {
        const dx = b.position.x - a.position.x || 0.1;
        const dy = b.position.y - a.position.y || 0.1;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const nx = dx / dist,
          ny = dy / dist;
        const dvn =
          (a.userData.vx - b.userData.vx) * nx +
          (a.userData.vy - b.userData.vy) * ny;
        if (dvn < 0) return;

        // Add some randomness to bounces for chaos, but damp impulse so momentum is reduced
        const randomFactor = 0.9 + Math.random() * 0.3; // 0.9 to 1.2
        const impulseX = dvn * nx * randomFactor * COLLISION_DAMPING;
        const impulseY = dvn * ny * randomFactor * COLLISION_DAMPING;
        a.userData.vx -= impulseX;
        a.userData.vy -= impulseY;
        b.userData.vx += impulseX;
        b.userData.vy += impulseY;
      }

      // Physics tuning
      const FRICTION = 0.96; // apply each frame to velocities
      const CENTER_PULL = 0.02; // small force pulling drawings toward screen center
      const MAX_VEL = 10; // clamp velocities so items don't escape
      const COLLISION_PUSH = 1.0; // reduced positional push after collision

      // ── Animation loop ────────────────────────────────────────────────
      function animate() {
        requestAnimationFrame(animate);
        renderer.clear();

        const t = performance.now() * 0.001;
        const now = performance.now();

        const toRemove = [];

        drawings.forEach((d) => {
          const ud = d.userData;

          // ── Removal fade-out ────────────────────────────────────────
          if (ud.removing) {
            ud.removeProgress = (ud.removeProgress || 0) + 0.2;
            d.material.opacity = Math.max(0, 1.0 - ud.removeProgress * 2);
            d.scale.multiplyScalar(0.96);
            if (ud.removeProgress > 0.4) toRemove.push(d);
            return;
          }

          // ── Auto-fade when flagged ──────────────────────────────────
          if (ud.flagged && ud.autoFadeStart) {
            const elapsed = now - ud.autoFadeStart;
            const frac = Math.min(elapsed / ud.autoFadeDuration, 1);
            d.material.opacity = 1.0 * (1 - frac * 0.7);
          }

          // ── Shake when freshly flagged ──────────────────────────────
          if (ud.flagged) {
            ud.flagTimer++;
            if (ud.flagTimer < 30) {
              d.position.x += Math.sin(ud.flagTimer * 1.8) * 3;
            }
          }

          // ── Movement ───────────────────────────────────────────────
          if (ud.launched) {
            // stronger gravity initially for a snappier landing
            ud.vy -= 0.18;
            d.position.x += ud.vx;
            d.position.y += ud.vy;
            if (Math.abs(ud.vy) < 1.5) {
              ud.launched = false;
              // More chaotic post-launch velocity
              ud.vy = (Math.random() - 0.5) * 1.2;
              ud.vx = (Math.random() - 0.5) * 1.2;
            }
          } else {
            d.position.x += ud.vx;
            d.position.y += ud.vy;
            // More pronounced wobble
            d.position.y += Math.sin(t + ud.wobble) * 0.3;
          }

          // Apply friction to velocities
          ud.vx *= FRICTION;
          ud.vy *= FRICTION;

          // Per-drawing gentle lateral drift to break grid patterns
          const driftX = Math.sin(t * 0.8 + ud.wobble) * 0.08;
          const driftY = Math.cos(t * 0.6 + ud.morphPhase) * 0.04;
          ud.vx += driftX * (ud.launched ? 0.3 : 1);
          ud.vy += driftY * (ud.launched ? 0.3 : 1);

          // center pull force proportional to distance from center, modulated per-drawing
          const pullFactor = ud.centerPullFactor || 1;
          const pullX =
            -d.position.x *
            CENTER_PULL *
            0.001 *
            (ud.launched ? 0.6 : 1) *
            pullFactor;
          const pullY =
            -d.position.y *
            CENTER_PULL *
            0.001 *
            (ud.launched ? 0.6 : 1) *
            pullFactor;
          ud.vx += pullX;
          ud.vy += pullY;

          // Agency impulses: occasional small random pushes so items appear to make decisions
          ud.agencyTimer = (ud.agencyTimer || 0) + 1;
          if (ud.agencyTimer > (ud.agencyInterval || 100)) {
            ud.agencyTimer = 0;
            // Random directional impulse biased toward center to avoid escape
            const ang = Math.random() * Math.PI * 2;
            const ix = Math.cos(ang) * ud.agencyStrength;
            const iy = Math.sin(ang) * ud.agencyStrength;
            // Slightly bias impulse toward center
            ud.vx += ix - d.position.x * 0.0006;
            ud.vy += iy - d.position.y * 0.0006;
          }

          // Clamp velocities
          ud.vx = Math.max(-MAX_VEL, Math.min(MAX_VEL, ud.vx));
          ud.vy = Math.max(-MAX_VEL, Math.min(MAX_VEL, ud.vy));

          // ── Morph / breathe ─────────────────────────────────────────
          const b1 =
            1 + Math.sin(t * ud.morphSpeed + ud.morphPhase) * ud.morphAmp;
          const b2 =
            1 +
            Math.cos(t * ud.morphSpeed * 1.37 + ud.morphPhase + 1) *
              (ud.morphAmp * 0.4);
          d.scale.set(b1 * b2, b1, 1);
          d.rotation.z += ud.rotationSpeed;

          // ── Trail ───────────────────────────────────────────────────
          ud.trailTimer++;
          if (ud.trailTimer % 3 === 0) {
            const ghost = ud.trail[ud.trailIndex % TRAIL_LENGTH];
            ghost.mesh.position.set(d.position.x, d.position.y, -1);
            ghost.mesh.rotation.z = d.rotation.z;
            ghost.mesh.scale.set(d.scale.x, d.scale.y, 1);
            ghost.mesh.material.opacity = 0.18;
            ud.trailIndex++;
          }
          ud.trail.forEach((g) => {
            g.mesh.material.opacity *= 0.82;
          });

          // ── Keep drawings near visible screen: soft bounce-back when approaching edges
          const marginX = window.innerWidth / 2 + 120; // allow small offscreen
          const marginY = window.innerHeight / 2 + 120;
          if (Math.abs(d.position.x) > marginX) {
            d.position.x = Math.sign(d.position.x) * marginX;
            d.userData.vx *= -0.5; // reverse and damp horizontal velocity
          }
          if (Math.abs(d.position.y) > marginY) {
            d.position.y = Math.sign(d.position.y) * marginY;
            d.userData.vy *= -0.5; // reverse and damp vertical velocity
          }
        });

        // ── Collision pass - ALL drawings bounce ─────────────────────────
        for (let i = 0; i < drawings.length; i++) {
          const a = drawings[i];
          if (a.userData.launched || a.userData.removing) continue;

          for (let j = i + 1; j < drawings.length; j++) {
            const b = drawings[j];
            if (b.userData.launched || b.userData.removing) continue;
            if (!overlaps(a, b)) continue;

            // All drawings bounce - removed personality system
            bounceVelocities(a, b);

            const dx = b.position.x - a.position.x || 0.1;
            const dy = b.position.y - a.position.y || 0.1;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const push = COLLISION_PUSH;
            a.position.x -= (dx / dist) * push;
            a.position.y -= (dy / dist) * push;
            b.position.x += (dx / dist) * push;
            b.position.y += (dy / dist) * push;
          }
        }

        // ── Remove flagged-out meshes ─────────────────────────────────────
        toRemove.forEach((d) => {
          const idx = drawings.indexOf(d);
          if (idx !== -1) drawings.splice(idx, 1);
          drawingMap.delete(d.userData.drawingId);
          disposeMesh(d);
        });

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
