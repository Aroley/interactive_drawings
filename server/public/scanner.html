<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scanner (keep this tab open)</title>
    <style>

  <body>
    <h2>🔍 Shape Scanner</h2>
    <div id="status">● disconnected</div>
    <p class="sub">Phallic shape detection only — OCR runs server-side.</p>
    <div id="log"></div>

    <script src="/socket.io/socket.io.js"></script>
    <canvas id="work" style="display: none"></canvas>

    <script>
      const socket = io();
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const work = document.getElementById("work");
      const wctx = work.getContext("2d", { willReadFrequently: true });

      socket.on("connect", () => {
        socket.emit("register", "scanner");
        statusEl.textContent = "● connected";
        statusEl.classList.add("online");
        log("info", "Connected to server ✓");
      });

      socket.on("disconnect", () => {
        statusEl.textContent = "● disconnected";
        statusEl.classList.remove("online");
        log("info", "Disconnected from server");
      });

      // ── Shape scan request ────────────────────────────────────────────────
      socket.on("scanThis", async ({ scanId, imageData }) => {
        log("info", `Shape-scanning ${scanId}…`);
        const reasons = [];

        try {
          const img = await loadImage(imageData);
          work.width = img.naturalWidth || img.width;
          work.height = img.naturalHeight || img.height;
          wctx.clearRect(0, 0, work.width, work.height);
          wctx.drawImage(img, 0, 0);
          const pixels = wctx.getImageData(0, 0, work.width, work.height);

          const phallicFlag = checkPhallic(pixels, work.width, work.height);
          if (phallicFlag) reasons.push(phallicFlag);

          const swastikaFlag = checkSwastika(pixels, work.width, work.height);
          if (swastikaFlag) reasons.push(swastikaFlag);

          const hateSymbolFlag = checkHateSymbols(
            pixels,
            work.width,
            work.height,
          );
          if (hateSymbolFlag) reasons.push(hateSymbolFlag);
        } catch (err) {
          log("info", `Error during shape scan (${scanId}): ${err.message}`);
        }

        socket.emit("shapeResult", { scanId, reasons });

        reasons.length === 0
          ? log("pass", `✓ ${scanId} — shape clean`)
          : log("fail", `✗ ${scanId} — ${reasons.join("; ")}`);
      });

      // ── Shared ink-mask builder ───────────────────────────────────────────
      function buildInkMask(pixels, W, H) {
        const { data } = pixels;
        const ink = new Uint8Array(W * H);
        let count = 0;
        for (let i = 0; i < W * H; i++) {
          const r = data[i * 4],
            g = data[i * 4 + 1],
            b = data[i * 4 + 2],
            a = data[i * 4 + 3];
          if (a > 20 && !(r > 230 && g > 230 && b > 230)) {
            ink[i] = 1;
            count++;
          }
        }
        return { ink, count };
      }

      function inkBounds(ink, W, H) {
        let minX = W,
          maxX = 0,
          minY = H,
          maxY = 0;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (ink[y * W + x]) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        return {
          minX,
          maxX,
          minY,
          maxY,
          bW: maxX - minX + 1,
          bH: maxY - minY + 1,
        };
      }

      // ── Phallic shape detection ───────────────────────────────────────────
      // Enhanced detection: looks for tall, cylindrical shapes with rounded tip
      // and optional testicles (exactly 2 rounded lobes) at the base
      function checkPhallic(pixels, W, H) {
        const { ink, count } = buildInkMask(pixels, W, H);
        // Accept much smaller drawings (kids draw small)
        if (count < 150) return null;

        const { minX, maxX, minY, maxY, bW, bH } = inkBounds(ink, W, H);
        if (bW < 4 || bH < 4) return null;

        const aspect = bH / bW;
        // Prefer portrait but accept less extreme child drawings
        if (aspect < 1.2) return null;

        // Analyze vertical profile into bands
        const BANDS = 14;
        const bandH = Math.max(1, Math.round(bH / BANDS));
        const widths = new Array(BANDS).fill(0);

        for (let b = 0; b < BANDS; b++) {
          const y0 = Math.min(maxY, Math.max(minY, minY + b * bandH));
          const y1 = Math.min(maxY, y0 + bandH);
          let left = W,
            right = 0,
            found = false;
          for (let y = y0; y <= y1; y++) {
            for (let x = minX; x <= maxX; x++) {
              if (ink[y * W + x]) {
                if (x < left) left = x;
                if (x > right) right = x;
                found = true;
              }
            }
          }
          widths[b] = found ? right - left + 1 : 0;
        }

        const maxW = Math.max(...widths) || 1;
        const normW = widths.map((w) => w / maxW);

        // symmetry
        const cx = (minX + maxX) / 2;
        let symScore = 0,
          symCount = 0;
        for (let y = minY; y <= maxY; y++) {
          let sumX = 0,
            cnt = 0;
          for (let x = minX; x <= maxX; x++) {
            if (ink[y * W + x]) {
              sumX += x;
              cnt++;
            }
          }
          if (cnt > 0) {
            symScore += 1 - Math.abs(sumX / cnt - cx) / (bW / 2);
            symCount++;
          }
        }
        const symmetry = symCount > 0 ? symScore / symCount : 0;

        const tipBands = normW.slice(0, 3);
        const shaftBands = normW.slice(3, 10);
        const baseBands = normW.slice(10);

        const avgTip = avg(tipBands);
        const avgShaft = avg(shaftBands);
        const avgBase = avg(baseBands);

        const hasWiderBase = avgBase > avgShaft * 1.12;
        const hasTwoLobes = detectTwoLobes(ink, W, H, minX, maxX, minY, maxY);
        const shaftVariance = variance(shaftBands);

        // Simple shaft detector: narrow vertical stroke with rounded tip
        function detectSimpleShaft() {
          // find the largest vertical contiguous run near center
          const midX = Math.round(cx);
          let runs = [];
          let runStart = null;
          for (let y = minY; y <= maxY; y++) {
            if (ink[y * W + midX]) {
              if (runStart === null) runStart = y;
            } else {
              if (runStart !== null) {
                runs.push([runStart, y - 1]);
                runStart = null;
              }
            }
          }
          if (runStart !== null) runs.push([runStart, maxY]);
          if (runs.length === 0) return false;
          // pick the longest run
          runs.sort((a, b) => b[1] - b[0] - (a[1] - a[0]));
          const [s, e] = runs[0];
          const length = e - s + 1;
          if (length < Math.max(6, Math.round(bH * 0.3))) return false;

          // check narrow width around midX for the shaft portion
          let shaftCount = 0,
            shaftTotal = 0;
          const wtol = Math.max(1, Math.round(bW * 0.12));
          for (
            let y = s + Math.round(length * 0.15);
            y <= e - Math.round(length * 0.05);
            y++
          ) {
            shaftTotal++;
            let rowHas = false;
            for (let dx = -wtol; dx <= wtol; dx++) {
              const x = midX + dx;
              if (x < minX || x > maxX) continue;
              if (ink[y * W + x]) {
                rowHas = true;
                break;
              }
            }
            if (rowHas) shaftCount++;
          }
          return shaftTotal > 0 && shaftCount / shaftTotal > 0.6;
        }

        const simpleShaft = detectSimpleShaft();

        // Rotated shaft detection: compute principal axis (PCA) of ink points
        function detectRotatedShaft() {
          // collect ink points
          const pts = [];
          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              if (ink[y * W + x]) pts.push([x, y]);
            }
          }
          if (pts.length < 30) return false;

          // centroid
          let sx = 0,
            sy = 0;
          for (const [x, y] of pts) {
            sx += x;
            sy += y;
          }
          const cxP = sx / pts.length;
          const cyP = sy / pts.length;

          // covariance
          let cxx = 0,
            cxy = 0,
            cyy = 0;
          for (const [x, y] of pts) {
            const dx = x - cxP;
            const dy = y - cyP;
            cxx += dx * dx;
            cxy += dx * dy;
            cyy += dy * dy;
          }
          cxx /= pts.length;
          cxy /= pts.length;
          cyy /= pts.length;

          // principal axis angle
          const theta = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
          const ux = Math.cos(theta);
          const uy = Math.sin(theta);

          // project points onto axis and measure orthogonal spread
          let minP = Infinity,
            maxP = -Infinity,
            minPerp = Infinity,
            maxPerp = -Infinity;
          for (const [x, y] of pts) {
            const dx = x - cxP;
            const dy = y - cyP;
            const proj = dx * ux + dy * uy;
            const perp = -dx * uy + dy * ux; // perpendicular coordinate
            if (proj < minP) minP = proj;
            if (proj > maxP) maxP = proj;
            if (perp < minPerp) minPerp = perp;
            if (perp > maxPerp) maxPerp = perp;
          }
          const length = maxP - minP;
          const perpWidth = maxPerp - minPerp;
          if (perpWidth <= 0) return false;

          // projected aspect along principal axis
          const projAspect = length / perpWidth;
          if (projAspect < 1.2) return false;

          // Now check for a contiguous run along axis with narrow cross-section
          const steps = Math.max(8, Math.round(length));
          let runStart = null,
            bestRun = 0;
          const wtol = Math.max(1, Math.round(Math.max(bW, bH) * 0.08));
          for (let s = 0; s <= steps; s++) {
            const t = minP + (length * s) / steps;
            // center point in image coords
            const cxs = Math.round(cxP + ux * t);
            const cys = Math.round(cyP + uy * t);
            // count ink in cross-section within perp tolerance
            let crossCount = 0,
              crossTotal = 0;
            for (let off = -wtol; off <= wtol; off++) {
              const xx = Math.round(cxs - uy * off);
              const yy = Math.round(cys + ux * off);
              if (xx < minX || xx > maxX || yy < minY || yy > maxY) continue;
              crossTotal++;
              if (ink[yy * W + xx]) crossCount++;
            }
            const frac = crossTotal > 0 ? crossCount / crossTotal : 0;
            if (frac > 0.6) {
              if (runStart === null) runStart = s;
            } else {
              if (runStart !== null) {
                bestRun = Math.max(bestRun, s - runStart);
                runStart = null;
              }
            }
          }
          if (runStart !== null) bestRun = Math.max(bestRun, steps - runStart);

          // require a reasonably long run along axis
          return bestRun >= Math.max(6, Math.round(steps * 0.4));
        }

        const rotatedShaft = detectRotatedShaft();

        // Detect narrow/tapered tip near the top compared to shaft and rounded base
        function detectTipNarrow() {
          // Require at least a small taper: tip bands should be noticeably narrower
          if (!tipBands || tipBands.length < 3) return false;
          const t0 = tipBands[0] || 0;
          const t1 = tipBands[1] || 0;
          const t2 = tipBands[2] || 0;
          // tip should be narrower than shaft by a margin
          if (!(t0 < avgShaft * 0.6 && t1 < avgShaft * 0.8)) return false;

          // Expect widths to increase going down (taper toward top)
          if (!(t0 <= t1 && t1 <= t2)) return false;

          // Check there's a central cap at the very top: center should have ink while sides fall off
          const topY = minY + Math.max(0, Math.round(bH * 0.06));
          const capHalf = Math.max(1, Math.round(Math.max(1, bW * 0.06)));
          let centerFilled = 0,
            sideFilled = 0,
            centerTotal = 0,
            sideTotal = 0;
          const cxRound = Math.round(cx);
          for (let x = cxRound - capHalf; x <= cxRound + capHalf; x++) {
            if (x < minX || x > maxX) continue;
            centerTotal++;
            if (ink[topY * W + x]) centerFilled++;
          }
          for (let x = minX; x <= maxX; x++) {
            if (x >= cxRound - capHalf && x <= cxRound + capHalf) continue;
            sideTotal++;
            if (ink[topY * W + x]) sideFilled++;
          }
          const centerFrac = centerTotal ? centerFilled / centerTotal : 0;
          const sideFrac = sideTotal ? sideFilled / sideTotal : 0;
          if (centerFrac < 0.25) return false;
          if (!(centerFrac > sideFrac * 1.6)) return false;

          // Also require two rounded lobes at base (detectTwoLobes already checks this)
          if (!hasTwoLobes) return false;

          return true;
        }

        const tipNarrow = detectTipNarrow();

        // Scoring: be permissive for simple/child drawings
        const criteria = [
          avgTip < avgShaft * 0.95,
          shaftVariance < 0.12,
          symmetry > 0.55,
          aspect > 1.3,
          avgShaft > 0.35,
          hasWiderBase || avgBase > 0.35,
          hasTwoLobes,
          tipNarrow,
        ];

        const score = criteria.filter(Boolean).length;

        if (
          score >= 4 ||
          // allow simpleShaft if it has clear two-lobes or a tapered tip
          (simpleShaft && (score >= 3 || hasTwoLobes || tipNarrow)) ||
          rotatedShaft
        ) {
          const details = [];
          details.push(`aspect ${aspect.toFixed(1)}`);
          details.push(`sym ${(symmetry * 100).toFixed(0)}%`);
          if (hasWiderBase) details.push("wide-base");
          if (hasTwoLobes) details.push("2-lobes");
          if (tipNarrow) details.push("tapered-tip");
          if (simpleShaft) details.push("simple-shaft");
          if (rotatedShaft) details.push("rotated-shaft");
          return `phallic shape (${score}/8: ${details.join(", ")})`;
        }

        return null;
      }

      // ── Detect exactly two rounded lobes at the bottom ────────────────────
      // Uses connected component labeling to find distinct ink regions in the
      // bottom 30% of the bounding box, then checks if exactly 2 are found
      // and if they're roughly the same size and roundish
      function detectTwoLobes(ink, W, H, minX, maxX, minY, maxY) {
        const bW = maxX - minX + 1;
        const bH = maxY - minY + 1;

        // Focus on bottom 30% of the drawing
        const baseStartY = Math.round(maxY - bH * 0.3);
        if (baseStartY >= maxY) return false;

        // Build a mini binary image of just the base region
        const baseH = maxY - baseStartY + 1;
        const baseW = bW;
        const baseMask = new Uint8Array(baseW * baseH);

        for (let y = baseStartY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            if (ink[y * W + x]) {
              const localY = y - baseStartY;
              const localX = x - minX;
              baseMask[localY * baseW + localX] = 1;
            }
          }
        }

        // Connected components labeling (flood fill)
        const labels = new Int32Array(baseW * baseH);
        let nextLabel = 1;
        const components = [];

        for (let y = 0; y < baseH; y++) {
          for (let x = 0; x < baseW; x++) {
            const idx = y * baseW + x;
            if (baseMask[idx] === 1 && labels[idx] === 0) {
              // Flood fill this component
              const pixels = floodFill(
                baseMask,
                labels,
                baseW,
                baseH,
                x,
                y,
                nextLabel,
              );
              components.push({ label: nextLabel, pixels, x, y });
              nextLabel++;
            }
          }
        }

        // Need exactly 2 components
        if (components.length !== 2) return false;

        // Both components should be roughly similar in size (within 3x of each other)
        const [c1, c2] = components;
        const sizeRatio =
          Math.max(c1.pixels.length, c2.pixels.length) /
          Math.min(c1.pixels.length, c2.pixels.length);
        if (sizeRatio > 3) return false;

        // Each component should be reasonably round (not super elongated)
        const isRound = (comp) => {
          let minX = baseW,
            maxX = 0,
            minY = baseH,
            maxY = 0;
          for (const [px, py] of comp.pixels) {
            if (px < minX) minX = px;
            if (px > maxX) maxX = px;
            if (py < minY) minY = py;
            if (py > maxY) maxY = py;
          }
          const w = maxX - minX + 1;
          const h = maxY - minY + 1;
          const aspectRatio = Math.max(w, h) / Math.min(w, h);
          return aspectRatio < 2.5; // Not too elongated
        };

        return isRound(c1) && isRound(c2);
      }

      // Flood fill helper for connected component labeling
      function floodFill(mask, labels, W, H, startX, startY, label) {
        const stack = [[startX, startY]];
        const pixels = [];

        while (stack.length > 0) {
          const [x, y] = stack.pop();
          const idx = y * W + x;

          if (x < 0 || x >= W || y < 0 || y >= H) continue;
          if (mask[idx] === 0 || labels[idx] !== 0) continue;

          labels[idx] = label;
          pixels.push([x, y]);

          // 4-connected neighbors
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }

        return pixels;
      }

      // ── Swastika detection ────────────────────────────────────────────────
      // Precise detection: central cross + perpendicular hooks at arm ends only
      function checkSwastika(pixels, W, H) {
        const { ink, count } = buildInkMask(pixels, W, H);
        if (count < 250) return null;

        const { minX, maxX, minY, maxY, bW, bH } = inkBounds(ink, W, H);
        if (bW < 14 || bH < 14) return null;

        // Must be roughly square
        const aspect = Math.max(bW, bH) / Math.min(bW, bH);
        if (aspect > 1.8) return null;

        const cx = Math.round((minX + maxX) / 2);
        const cy = Math.round((minY + maxY) / 2);

        // central cross density
        // slightly larger central cross region for stricter checks
        const crossW = Math.max(2, Math.round(Math.min(bW, bH) * 0.18));
        let hCross = 0,
          hTotal = 0;
        for (let y = cy - crossW; y <= cy + crossW; y++) {
          const crossW = Math.max(2, Math.round(Math.min(bW, bH) * 0.2));
          for (let x = minX; x <= maxX; x++) {
            hTotal++;
            if (ink[y * W + x]) hCross++;
          }
        }

        let vCross = 0,
          vTotal = 0;
        for (let x = cx - crossW; x <= cx + crossW; x++) {
          if (x < minX || x > maxX) continue;
          for (let y = minY; y <= maxY; y++) {
            vTotal++;
            if (ink[y * W + x]) vCross++;
          }
        }

        const hDensity = hTotal > 0 ? hCross / hTotal : 0;
        const vDensity = vTotal > 0 ? vCross / vTotal : 0;

        // require a clearly visible cross
        if (hDensity < 0.45 || vDensity < 0.45) return null;

        // Attempt 1: hook detection via endpoint tracing (existing approach)
        function traceEndpoint(sx, sy, dx, dy, maxSteps) {
          if (hDensity < 0.5 || vDensity < 0.5) return null;
          let last = null;
          for (let i = 1; i <= maxSteps; i++) {
            // Reject overly fragmented scribbles: too many disjoint components inside bbox
            const compCount = countConnectedComponents(
              ink,
              W,
              H,
              minX,
              maxX,
              minY,
              maxY,
            );
            if (compCount > 8) return null;
            const x = sx + dx * i;
            const y = sy + dy * i;
            if (x < minX || x > maxX || y < minY || y > maxY) break;
            let found = false;
            const perp = Math.max(1, Math.round(Math.min(bW, bH) * 0.04));
            for (let o = -perp; o <= perp; o++) {
              const px = Math.round(x + (dy === 0 ? 0 : o));
              const py = Math.round(y + (dx === 0 ? 0 : o));
              if (px < minX || px > maxX || py < minY || py > maxY) continue;
              if (ink[py * W + px]) {
                found = true;
                break;
              }
            }
            if (found) last = [x, y];
            else break;
          }
          return last;
        }

        const maxTrace = Math.round(Math.min(bW, bH) * 0.5);
        const topEP = traceEndpoint(cx, cy, 0, -1, maxTrace);
        const botEP = traceEndpoint(cx, cy, 0, +1, maxTrace);
        const leftEP = traceEndpoint(cx, cy, -1, 0, maxTrace);
        const rightEP = traceEndpoint(cx, cy, +1, 0, maxTrace);

        function checkHookAt(ex, ey, orientation) {
          const hookLen = Math.max(4, Math.round(Math.min(bW, bH) * 0.22));
          const minFilled = Math.max(3, Math.round(hookLen * 0.6));
          let best = 0;
          if (orientation === "h") {
            // left
            let leftFilled = 0;
            for (let i = 1; i <= hookLen; i++) {
              const x = Math.round(ex - i);
              if (x < minX) break;
              for (let dy = -1; dy <= 1; dy++) {
                const y = Math.round(ey + dy);
                if (y < minY || y > maxY) continue;
                if (ink[y * W + x]) {
                  leftFilled++;
                  break;
                }
              }
            }
            best = Math.max(best, leftFilled);
            // right
            let rightFilled = 0;
            for (let i = 1; i <= hookLen; i++) {
              const x = Math.round(ex + i);
              if (x > maxX) break;
              for (let dy = -1; dy <= 1; dy++) {
                const y = Math.round(ey + dy);
                if (y < minY || y > maxY) continue;
                if (ink[y * W + x]) {
                  rightFilled++;
                  break;
                }
              }
            }
            best = Math.max(best, rightFilled);
          } else {
            let upFilled = 0;
            for (let i = 1; i <= hookLen; i++) {
              const y = Math.round(ey - i);
              if (y < minY) break;
              for (let dx = -1; dx <= 1; dx++) {
                const x = Math.round(ex + dx);
                if (x < minX || x > maxX) continue;
                if (ink[y * W + x]) {
                  upFilled++;
                  break;
                }
              }
            }
            best = Math.max(best, upFilled);
            let downFilled = 0;
            for (let i = 1; i <= hookLen; i++) {
              const y = Math.round(ey + i);
              if (y > maxY) break;
              for (let dx = -1; dx <= 1; dx++) {
                const x = Math.round(ex + dx);
                if (x < minX || x > maxX) continue;
                if (ink[y * W + x]) {
                  downFilled++;
                  break;
                }
              }
            }
            best = Math.max(best, downFilled);
          }
          return best >= minFilled;
        }

        let hooksFound = 0;
        if (topEP && checkHookAt(topEP[0], topEP[1], "h")) hooksFound++;
        if (botEP && checkHookAt(botEP[0], botEP[1], "h")) hooksFound++;
        if (leftEP && checkHookAt(leftEP[0], leftEP[1], "v")) hooksFound++;
        if (rightEP && checkHookAt(rightEP[0], rightEP[1], "v")) hooksFound++;

        // Simple orientation sanity: endpoints should be on their respective sides
        const orientationMatch = Boolean(
          topEP &&
          botEP &&
          leftEP &&
          rightEP &&
          topEP[1] < cy &&
          botEP[1] > cy &&
          leftEP[0] < cx &&
          rightEP[0] > cx,
        );

        // Attempt 2: corner L-shape detection (fallback) — detect L shapes in 4 corners
        function detectCornerLs() {
          const cornerW = Math.max(4, Math.round(bW * 0.3));
          const cornerH = Math.max(4, Math.round(bH * 0.3));
          const minLen = Math.max(3, Math.round(Math.min(bW, bH) * 0.16));
          let found = 0;

          const corners = [
            { sx: minX, sy: minY, ox: 1, oy: 1 }, // top-left
            { sx: maxX - cornerW + 1, sy: minY, ox: -1, oy: 1 }, // top-right
            { sx: minX, sy: maxY - cornerH + 1, ox: 1, oy: -1 }, // bottom-left
            { sx: maxX - cornerW + 1, sy: maxY - cornerH + 1, ox: -1, oy: -1 }, // bottom-right
          ];

          for (const c of corners) {
            let cornerHit = false;
            for (let y = c.sy; y < c.sy + cornerH && !cornerHit; y++) {
              for (let x = c.sx; x < c.sx + cornerW; x++) {
                if (x < minX || x > maxX || y < minY || y > maxY) continue;
                if (!ink[y * W + x]) continue;
                // measure horizontal run in direction ox
                let hx = 0;
                for (let i = 0; i < minLen; i++) {
                  const xx = x + i * c.ox;
                  if (xx < minX || xx > maxX) break;
                  if (ink[y * W + xx]) hx++;
                  else break;
                }
                if (hx < minLen) continue;
                // measure vertical run in direction oy
                let hy = 0;
                for (let j = 0; j < minLen; j++) {
                  const yy = y + j * c.oy;
                  if (yy < minY || yy > maxY) break;
                  if (ink[yy * W + x]) hy++;
                  else break;
                }
                if (hy < minLen) continue;
                cornerHit = true;
                break;
              }
            }
            if (cornerHit) found++;
          }
          return found;
        }

        const cornerCount = detectCornerLs();

        // Final decision: accept if either endpoint-hook method found 3+ hooks
        // or corner L-shapes found 3+ corners and central cross is visible.
        // Require all 4 hooks and consistent rotational orientation for a stricter match,
        // otherwise require all 4 corner Ls as fallback.
        if (
          (hooksFound === 4 &&
            orientationMatch &&
            hDensity >= 0.45 &&
            vDensity >= 0.45) ||
          (cornerCount >= 4 && hDensity >= 0.42 && vDensity >= 0.42)
        ) {
          const totalHooks = Math.max(hooksFound, cornerCount);
          return `swastika (cross ${Math.round(hDensity * 100)}%/${Math.round(vDensity * 100)}% + ${totalHooks} hooks)`;
        }

        return null;
      }

      // Count connected components in a region
      function countConnectedComponents(ink, W, H, minX, maxX, minY, maxY) {
        const visited = new Uint8Array((maxX - minX + 1) * (maxY - minY + 1));
        const bW = maxX - minX + 1;
        let componentCount = 0;

        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const localIdx = (y - minY) * bW + (x - minX);
            if (ink[y * W + x] && !visited[localIdx]) {
              // Found a new component - flood fill it
              const stack = [[x, y]];
              while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const cLocalIdx = (cy - minY) * bW + (cx - minX);

                if (cx < minX || cx > maxX || cy < minY || cy > maxY) continue;
                if (visited[cLocalIdx] || !ink[cy * W + cx]) continue;

                visited[cLocalIdx] = 1;

                // 8-connected neighbors
                for (let dy = -1; dy <= 1; dy++) {
                  for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    stack.push([cx + dx, cy + dy]);
                  }
                }
              }
              componentCount++;
            }
          }
        }

        return componentCount;
      }

      // ── Other hate symbols detection ──────────────────────────────────────
      // Detects: SS bolts, KKK, 88, 14, confederate flag patterns, noose
      function checkHateSymbols(pixels, W, H) {
        const { ink, count } = buildInkMask(pixels, W, H);
        if (count < 300) return null;

        const { minX, maxX, minY, maxY, bW, bH } = inkBounds(ink, W, H);
        if (bW < 15 || bH < 15) return null;

        // ── SS Lightning Bolts ────────────────────────────────────────────
        // Two parallel vertical zigzag shapes
        const aspect = bH / bW;
        if (aspect > 1.3 && aspect < 3.5) {
          // Tall and narrow (lightning bolt)
          // Check for zigzag pattern by sampling vertical profile variance
          const BANDS = 12;
          const bandH = bH / BANDS;
          const widths = [];

          for (let b = 0; b < BANDS; b++) {
            const y0 = Math.round(minY + b * bandH);
            const y1 = Math.round(minY + (b + 1) * bandH);
            let left = W,
              right = 0;
            for (let y = y0; y < Math.min(y1, H); y++) {
              for (let x = minX; x <= maxX; x++) {
                if (ink[y * W + x]) {
                  if (x < left) left = x;
                  if (x > right) right = x;
                }
              }
            }
            widths.push(right - left + 1);
          }

          // Zigzag has alternating wide/narrow sections (high variance)
          const widthVar = variance(widths);
          const avgWidth = avg(widths);
          const relativeVar = widthVar / (avgWidth * avgWidth);

          // Also check for two distinct vertical components (double SS)
          const midX = Math.round((minX + maxX) / 2);
          let leftInk = 0,
            rightInk = 0;
          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x < midX; x++) {
              if (ink[y * W + x]) leftInk++;
            }
            for (let x = midX; x <= maxX; x++) {
              if (ink[y * W + x]) rightInk++;
            }
          }
          const hasTwoColumns =
            leftInk > 50 &&
            rightInk > 50 &&
            Math.max(leftInk, rightInk) / Math.min(leftInk, rightInk) < 2;

          if (relativeVar > 0.15 && hasTwoColumns) {
            return "SS lightning bolts pattern";
          }
        }

        // ── Noose detection ────────────────────────────────────────────────
        // Loop at top with vertical line down
        if (aspect > 1.5) {
          // Taller than wide
          const topThird = Math.round(minY + bH * 0.33);

          // Check for loop in top section (circular ink density)
          let topInk = 0,
            topTotal = 0;
          for (let y = minY; y < topThird; y++) {
            for (let x = minX; x <= maxX; x++) {
              topTotal++;
              if (ink[y * W + x]) topInk++;
            }
          }

          // Check for vertical line in bottom section
          const cx = Math.round((minX + maxX) / 2);
          const lineWidth = Math.round(bW * 0.3);
          let bottomLineInk = 0,
            bottomLineTotal = 0;
          for (let y = topThird; y <= maxY; y++) {
            for (let x = cx - lineWidth; x <= cx + lineWidth; x++) {
              if (x >= minX && x <= maxX) {
                bottomLineTotal++;
                if (ink[y * W + x]) bottomLineInk++;
              }
            }
          }

          const topDensity = topTotal > 0 ? topInk / topTotal : 0;
          const bottomLineDensity =
            bottomLineTotal > 0 ? bottomLineInk / bottomLineTotal : 0;

          if (topDensity > 0.3 && bottomLineDensity > 0.4) {
            return "noose shape";
          }
        }

        // ── Number patterns (88, 14, etc.) handled by OCR ─────────────────
        // These are better caught by text detection

        return null;
      }

      // ── Helpers ───────────────────────────────────────────────────────────
      function avg(arr) {
        return arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
      }
      function variance(arr) {
        const m = avg(arr);
        return avg(arr.map((x) => (x - m) ** 2));
      }

      function loadImage(src) {
        return new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = () => rej(new Error("Image load failed"));
          img.src = src;
        });
      }

      function log(cls, msg) {
        const line = document.createElement("div");
        line.className = cls;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.prepend(line);
        while (logEl.children.length > 200) logEl.removeChild(logEl.lastChild);
      }
    </script>
  </body>
